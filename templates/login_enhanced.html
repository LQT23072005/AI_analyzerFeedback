{% extends "base_enhanced.html" %}

{% block title %}Login - AI Feedback Analyzer{% endblock %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center animate-fade-in">
    <div class="card p-8 max-w-md w-full mx-4">
        <!-- Logo -->
        <div class="text-center mb-8">
            <i class="bi bi-shield-lock-fill text-6xl bg-gradient-to-r from-indigo-600 to-purple-600 bg-clip-text text-transparent"></i>
            <h2 class="text-3xl font-bold text-gray-800 dark:text-white mt-4">Welcome Back</h2>
            <p class="text-gray-600 dark:text-gray-300 mt-2">Sign in to access your dashboard</p>
        </div>
        
        <!-- Login Form -->
        <form id="loginForm" class="space-y-6">
            <div>
                <label class="block text-sm font-medium mb-2 text-gray-700 dark:text-gray-200">
                    <i class="bi bi-person"></i> Username
                </label>
                <input type="text" id="username" required
                       class="w-full px-4 py-3 rounded-lg bg-white/50 dark:bg-gray-700/50 border border-gray-300 dark:border-gray-600 focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition"
                       placeholder="Enter your username">
            </div>
            
            <div>
                <label class="block text-sm font-medium mb-2 text-gray-700 dark:text-gray-200">
                    <i class="bi bi-lock"></i> Password
                </label>
                <input type="password" id="password" required
                       class="w-full px-4 py-3 rounded-lg bg-white/50 dark:bg-gray-700/50 border border-gray-300 dark:border-gray-600 focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition"
                       placeholder="Enter your password">
            </div>
            
            <button type="submit" class="w-full btn-primary py-3">
                <i class="bi bi-box-arrow-in-right"></i> Sign In
                <span id="loginSpinner" class="hidden ml-2">
                    <i class="bi bi-arrow-repeat animate-spin"></i>
                </span>
            </button>
        </form>
        
        <!-- Demo Credentials -->
        <div class="mt-6 p-4 bg-blue-100 dark:bg-blue-900/30 rounded-lg">
            <p class="text-sm font-medium text-blue-800 dark:text-blue-200 mb-2">
                <i class="bi bi-info-circle"></i> Demo Credentials:
            </p>
            <p class="text-sm text-blue-700 dark:text-blue-300">
                <strong>Admin:</strong> username: <code>admin</code>, password: <code>admin123</code>
            </p>
        </div>
        
        <!-- Register Link -->
        <div class="mt-6 text-center">
            <p class="text-gray-600 dark:text-gray-400">
                Don't have an account?
                <a href="/register" class="text-indigo-600 dark:text-indigo-400 hover:underline font-medium">
                    Register here
                </a>
            </p>
        </div>
    </div>
</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const spinner = document.getElementById('loginSpinner');
        spinner.classList.remove('hidden');
        
        const formData = new FormData();
        formData.append('username', document.getElementById('username').value);
        formData.append('password', document.getElementById('password').value);
        
        try {
            const response = await fetch('/login', {
                method: 'POST',
                body: formData
            });
            
            const data = await response.json();
            
            if (data.success) {
                showToast('Login successful!', 'success');
                setTimeout(() => {
                    window.location.href = '/';
                }, 1000);
            } else {
                showToast(data.message || 'Login failed', 'error');
            }
        } catch (error) {
            showToast('Error: ' + error.message, 'error');
        } finally {
            spinner.classList.add('hidden');
        }
    });
</script>
{% endblock %}
