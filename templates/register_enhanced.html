{% extends "base_enhanced.html" %}

{% block title %}Register - AI Feedback Analyzer{% endblock %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center animate-fade-in">
    <div class="card p-8 max-w-md w-full mx-4">
        <!-- Logo -->
        <div class="text-center mb-8">
            <i class="bi bi-person-plus-fill text-6xl bg-gradient-to-r from-purple-600 to-pink-600 bg-clip-text text-transparent"></i>
            <h2 class="text-3xl font-bold text-gray-800 dark:text-white mt-4">Create Account</h2>
            <p class="text-gray-600 dark:text-gray-300 mt-2">Join us to start analyzing feedback</p>
        </div>
        
        <!-- Register Form -->
        <form id="registerForm" class="space-y-6">
            <div>
                <label class="block text-sm font-medium mb-2 text-gray-700 dark:text-gray-200">
                    <i class="bi bi-person"></i> Username
                </label>
                <input type="text" id="username" required
                       class="w-full px-4 py-3 rounded-lg bg-white/50 dark:bg-gray-700/50 border border-gray-300 dark:border-gray-600 focus:ring-2 focus:ring-purple-500 focus:border-transparent transition"
                       placeholder="Choose a username">
            </div>
            
            <div>
                <label class="block text-sm font-medium mb-2 text-gray-700 dark:text-gray-200">
                    <i class="bi bi-envelope"></i> Email
                </label>
                <input type="email" id="email" required
                       class="w-full px-4 py-3 rounded-lg bg-white/50 dark:bg-gray-700/50 border border-gray-300 dark:border-gray-600 focus:ring-2 focus:ring-purple-500 focus:border-transparent transition"
                       placeholder="your.email@example.com">
            </div>
            
            <div>
                <label class="block text-sm font-medium mb-2 text-gray-700 dark:text-gray-200">
                    <i class="bi bi-lock"></i> Password
                </label>
                <input type="password" id="password" required
                       class="w-full px-4 py-3 rounded-lg bg-white/50 dark:bg-gray-700/50 border border-gray-300 dark:border-gray-600 focus:ring-2 focus:ring-purple-500 focus:border-transparent transition"
                       placeholder="Create a strong password">
                <p class="text-xs text-gray-500 dark:text-gray-400 mt-1">
                    <i class="bi bi-info-circle"></i> Minimum 6 characters
                </p>
            </div>
            
            <div>
                <label class="block text-sm font-medium mb-2 text-gray-700 dark:text-gray-200">
                    <i class="bi bi-lock-fill"></i> Confirm Password
                </label>
                <input type="password" id="confirm_password" required
                       class="w-full px-4 py-3 rounded-lg bg-white/50 dark:bg-gray-700/50 border border-gray-300 dark:border-gray-600 focus:ring-2 focus:ring-purple-500 focus:border-transparent transition"
                       placeholder="Confirm your password">
            </div>
            
            <button type="submit" class="w-full gradient-secondary text-white py-3 rounded-lg font-semibold hover:scale-105 transition">
                <i class="bi bi-rocket-takeoff"></i> Create Account
                <span id="registerSpinner" class="hidden ml-2">
                    <i class="bi bi-arrow-repeat animate-spin"></i>
                </span>
            </button>
        </form>
        
        <!-- Login Link -->
        <div class="mt-6 text-center">
            <p class="text-gray-600 dark:text-gray-400">
                Already have an account?
                <a href="/login" class="text-purple-600 dark:text-purple-400 hover:underline font-medium">
                    Login here
                </a>
            </p>
        </div>
    </div>
</div>

<script>
    document.getElementById('registerForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirm_password').value;
        
        if (password !== confirmPassword) {
            showToast('Passwords do not match!', 'error');
            return;
        }
        
        if (password.length < 6) {
            showToast('Password must be at least 6 characters!', 'error');
            return;
        }
        
        const spinner = document.getElementById('registerSpinner');
        spinner.classList.remove('hidden');
        
        const formData = new FormData();
        formData.append('username', document.getElementById('username').value);
        formData.append('email', document.getElementById('email').value);
        formData.append('password', password);
        
        try {
            const response = await fetch('/register', {
                method: 'POST',
                body: formData
            });
            
            const data = await response.json();
            
            if (data.success) {
                showToast('Registration successful! Redirecting to login...', 'success');
                setTimeout(() => {
                    window.location.href = '/login';
                }, 1500);
            } else {
                showToast(data.message || 'Registration failed', 'error');
            }
        } catch (error) {
            showToast('Error: ' + error.message, 'error');
        } finally {
            spinner.classList.add('hidden');
        }
    });
</script>
{% endblock %}
