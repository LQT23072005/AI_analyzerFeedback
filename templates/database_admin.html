{% extends "base_enhanced.html" %}{% block title %}Quản lý cơ sở dữ liệu{% endblock %}{% block content %}
<style>
.dm{max-width:1250px;margin:auto;color:#213047}.dm h1{font-size:29px;font-weight:750}.dm h2{font-size:20px;font-weight:700}.dm p{line-height:1.65}.dm .box{background:white;border:1px solid #dde4ef;border-radius:14px;padding:24px;margin:18px 0}.dm .bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.dm select,.dm input,.dm textarea{border:1px solid #c9d3e3;padding:10px 12px;border-radius:8px;background:white;color:#213047;font:inherit;max-width:100%}.dm textarea{width:100%;min-height:95px;line-height:1.6}.dm button{padding:8px 13px;background:#5446c8;color:white;border-radius:7px;cursor:pointer;font-weight:600}.dm button:disabled{opacity:.45;cursor:default}.dm button.secondary{background:#eef1f8;color:#485b77}.dm button.danger{background:#fff0ee;color:#b23d30}.dm .scroll{overflow:auto;max-height:520px}.dm table{width:100%;border-collapse:collapse;font-size:13px}.dm th,.dm td{padding:12px;border-bottom:1px solid #e1e7f0;text-align:left;vertical-align:top;max-width:320px;overflow-wrap:anywhere}.dm th{background:#eef2f9;position:sticky;top:0;white-space:nowrap}.dm .muted{color:#718096;font-size:13px}.dm label.field{display:block;margin:16px 0 5px;font-weight:650}.dm .readonly{background:#f4f6fa;color:#6f7c90}.dm pre{font:12px/1.6 Consolas,monospace;white-space:pre-wrap;background:#f4f6fa;padding:16px;border-radius:8px;max-height:480px;overflow:auto}.dm #notice{white-space:pre-wrap;margin:14px 0;padding:12px;border-radius:8px;background:#eef2ff}.dm .group{border-top:1px solid #dfe5ee;margin-top:20px;padding-top:16px}.dm .actions{display:flex;gap:7px;white-space:nowrap}.dm .actions button{font-size:12px}.dm [hidden]{display:none!important}.dm small{color:#77859b}

.dm .toolbar{display:grid;grid-template-columns:minmax(220px,1fr) minmax(190px,1fr) auto auto;gap:16px;align-items:end;margin-bottom:22px}
.dm .toolbar label{display:flex;flex-direction:column;gap:8px;min-width:0;font-size:14px;font-weight:600}
.dm .toolbar select{box-sizing:border-box;width:100%;height:46px;font-weight:400;padding:10px 36px 10px 12px}
.dm .toolbar button{height:46px;padding:0 20px;white-space:nowrap}
.dm .toolbar #count{align-self:end;display:flex;align-items:center;min-height:46px;white-space:nowrap}
.dm td{vertical-align:middle}.dm td:last-child{width:190px}.dm .actions{display:flex;align-items:center;gap:8px;white-space:nowrap}.dm .actions button{min-height:38px;flex:none}
.dm button:focus-visible,.dm select:focus-visible{outline:3px solid #c7c3ff;outline-offset:2px}
@media(max-width:760px){.dm .toolbar{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.dm .toolbar button{width:100%}.dm .box{padding:18px}.dm table{min-width:850px}}
@media(max-width:440px){.dm .toolbar{grid-template-columns:minmax(0,1fr)}.dm .toolbar #count{min-height:20px}}
</style>
<div class="dm"><h1>Quản lý cơ sở dữ liệu</h1><p>Xem bảng, sửa nội dung và xóa từng bản ghi.</p>
<section class="box"><div class="toolbar"><label>Database <select id="database">{% for key,label in databases.items() %}<option value="{{ key }}">{{ label }}</option>{% endfor %}</select></label><label>Bảng <select id="table"></select></label><button id="reload" class="secondary">Làm mới</button><span id="count" class="muted"></span></div><div id="notice" role="status" hidden></div><div class="scroll"><table><thead id="head"></thead><tbody id="body"></tbody></table></div><div class="bar" style="margin-top:16px"><button id="previous" class="secondary">← Trang trước</button><span id="page" class="muted"></span><button id="next" class="secondary">Trang sau →</button></div></section>
<section class="box" id="editor" hidden><h2 id="editorTitle"></h2><p id="editorNote" class="muted"></p><form id="editForm"><div id="fields"></div><div class="bar" style="margin-top:20px"><button id="save" type="submit">Lưu thay đổi</button><button type="button" class="secondary" id="cancel">Đóng</button></div></form><details style="margin-top:20px"><summary style="cursor:pointer">Xem bản ghi gốc dạng JSON</summary><pre id="original"></pre></details></section></div>
<script>
(()=>{
 const token={{ token|tojson }},db=document.getElementById('database'),table=document.getElementById('table'),body=document.getElementById('body'),head=document.getElementById('head'),editor=document.getElementById('editor'),fields=document.getElementById('fields'),notice=document.getElementById('notice');
 let state={rows:[],columns:[],page:1,pages:1},selection=null,getters=[];
 function notify(text,error=false){notice.hidden=false;notice.textContent=text;notice.style.background=error?'#fff0ee':'#eef2ff';}
 async function api(path,options={}){const response=await fetch(path,{...options,headers:{'Content-Type':'application/json','X-Database-Token':token,...options.headers}});const data=await response.json();if(!response.ok)throw Error(data.error||'Không thực hiện được thao tác.');return data;}
 function cell(row,value){const td=document.createElement('td');td.textContent=value===null?'NULL':String(value??'');row.append(td);return td;}
 function action(container,label,handler,type='secondary'){const b=document.createElement('button');b.type='button';b.textContent=label;b.className=type;b.onclick=handler;container.append(b);return b;}
 async function loadTables(){try{editor.hidden=true;const result=await api('/database/api/tables?db='+db.value);table.replaceChildren();for(const name of result.tables)table.add(new Option(name,name));if(result.tables.length)await loadRows(1);else{body.replaceChildren();head.replaceChildren();notify('Database chưa có bảng.');}}catch(e){notify(e.message,true);}}
 async function loadRows(page=1){try{editor.hidden=true;state=await api('/database/api/rows?'+new URLSearchParams({db:db.value,table:table.value,page}));body.replaceChildren();head.replaceChildren();const header=document.createElement('tr');const reports=table.value==='product_reports';const columns=reports?['Mã báo cáo','Tên file','Trạng thái','Đã xử lý','Số đánh giá']:state.columns.map(c=>c.name);for(const name of [...columns,'Thao tác']){const th=document.createElement('th');th.textContent=name;header.append(th);}head.append(header);
  state.rows.forEach((row,index)=>{const tr=document.createElement('tr');const values=reports?[row.values.id,row.summary.filename,row.summary.status,row.summary.processed,row.summary.reviews]:state.columns.map(c=>c.name==='password_hash'?'Đã ẩn':row.values[c.name]);for(const value of values)cell(tr,typeof value==='string'&&value.length>180?value.slice(0,180)+'…':value);const actionCell=cell(tr,'');const buttons=document.createElement('div');buttons.className='actions';actionCell.append(buttons);action(buttons,'Xem',()=>openEditor(index,true));action(buttons,'Sửa',()=>openEditor(index,false));action(buttons,'Xóa',()=>remove(index),'danger');body.append(tr);});
  document.getElementById('count').textContent=state.total+' bản ghi';document.getElementById('page').textContent=`Trang ${state.page}/${state.pages}`;document.getElementById('previous').disabled=state.page<=1;document.getElementById('next').disabled=state.page>=state.pages;
 }catch(e){notify(e.message,true);}}
 function field(label,value,setter,options={}){const title=document.createElement('label');title.className='field';title.textContent=label;const input=document.createElement(options.long?'textarea':'input');if(!options.long)input.type=options.numeric?'number':'text';if(options.numeric)input.step='any';input.value=value??'';input.readOnly=!!options.readonly;if(options.readonly)input.className='readonly';title.append(input);fields.append(title);let nullable=null;if(options.nullable){nullable=document.createElement('input');nullable.type='checkbox';nullable.checked=value===null;const wrap=document.createElement('label');wrap.className='muted';wrap.append(nullable,document.createTextNode(' NULL (không có giá trị)'));fields.append(wrap);nullable.onchange=()=>{input.disabled=nullable.checked;};input.disabled=nullable.checked;}
  if(!options.readonly)getters.push(()=>setter(nullable?.checked?null:options.numeric&&input.value!==''?Number(input.value):input.value));
 }
 function openEditor(index,readonly){selection=state.rows[index];getters=[];fields.replaceChildren();editor.hidden=false;document.getElementById('editorTitle').textContent=(readonly?'Xem':'Sửa')+' bản ghi '+selection.values[state.primary_key];document.getElementById('save').hidden=readonly;const preview={...selection.values};if(table.value==='product_reports'){try{preview.payload=JSON.parse(preview.payload);}catch{}}document.getElementById('original').textContent=JSON.stringify(preview,null,2);let update={};
  if(table.value==='product_reports'){
   const report=JSON.parse(selection.values.payload);update={payload:''};selection.draft=report;
   document.getElementById('editorNote').textContent='Sửa tên file, bối cảnh, cách diễn giải phát hiện, đề xuất và cách kiểm chứng. Đánh giá gốc, trích dẫn và số liệu được giữ nguyên. Lưu thay đổi không gọi AI lại.';
   field('Tên file báo cáo',report.filename,v=>report.filename=v,{readonly});field('Sản phẩm và mục tiêu',report.context,v=>report.context=v,{long:true,readonly});
   report.groups.forEach((g,i)=>{const heading=document.createElement('h2');heading.className='group';heading.textContent=`Nhóm ${i+1}: ${g.category} (${g.kind})`;fields.append(heading);g.evidence.forEach((e,j)=>field(`Phát hiện ${j+1} — dòng ${e.review_id}: “${e.quote}”`,e.topic,v=>{e.topic=v;for(const a of g.actions)for(const linked of a.evidence||[])if(linked.review_id===e.review_id&&linked.quote===e.quote)linked.topic=v;},{long:true,readonly}));g.actions.forEach((a,j)=>{field(`Đề xuất ${j+1}`,a.action,v=>a.action=v,{long:true,readonly});field(`Cách kiểm chứng ${j+1}`,a.measurement,v=>a.measurement=v,{long:true,readonly});});});
   getters.push(()=>{update.payload=JSON.stringify(report);});
  }else{
   document.getElementById('editorNote').textContent='Sửa các ô cần thay đổi. Khóa chính và mật khẩu đã băm không chỉnh sửa tại đây.';
   state.columns.forEach(c=>{if(c.name==='password_hash')return;field(c.name,selection.values[c.name],v=>update[c.name]=v,{readonly:readonly||c.readonly,long:typeof selection.values[c.name]==='string'&&selection.values[c.name].length>100,numeric:/INT|REAL|NUM|FLOAT|DOUBLE/i.test(c.type),nullable:!c.notnull&&!c.pk&&!readonly&&!c.readonly});});
  }
  selection.update=update;editor.scrollIntoView({behavior:'smooth',block:'start'});
 }
 async function remove(index){const row=state.rows[index],id=row.values[state.primary_key];if(!confirm(`Xóa bản ghi ${id}${row.summary.filename?' — '+row.summary.filename:''}?\nBản sao database sẽ được lưu trước khi xóa.`))return;try{const result=await api('/database/api/row',{method:'DELETE',body:JSON.stringify({db:db.value,table:table.value,id,version:row.version,confirm:'delete'})});await loadRows(state.page);notify(result.message+' Sao lưu: '+result.backup);}catch(e){notify(e.message,true);}}
 document.getElementById('editForm').onsubmit=async event=>{event.preventDefault();if(!selection)return;const button=document.getElementById('save');button.disabled=true;try{getters.forEach(g=>g());const result=await api('/database/api/row',{method:'POST',body:JSON.stringify({db:db.value,table:table.value,id:selection.values[state.primary_key],version:selection.version,values:selection.update})});await loadRows(state.page);notify(result.message+' Sao lưu: '+result.backup);}catch(e){notify(e.message,true);notice.scrollIntoView({behavior:'smooth'});}finally{button.disabled=false;}};
 db.onchange=loadTables;table.onchange=()=>loadRows(1);document.getElementById('reload').onclick=()=>loadRows(state.page);document.getElementById('previous').onclick=()=>loadRows(state.page-1);document.getElementById('next').onclick=()=>loadRows(state.page+1);document.getElementById('cancel').onclick=()=>editor.hidden=true;loadTables();
})();
</script>{% endblock %}
